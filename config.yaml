# =============================================================================
# Configuração da automação Novimz Auto-Publisher (Python + GitHub Actions)
# =============================================================================
# Este ficheiro NÃO contém segredos (chaves de API, palavras-passe). Todos os
# segredos vêm de variáveis de ambiente, definidas como "Repository secrets"
# no GitHub Actions (Settings → Secrets and variables → Actions). Ver README.md
# para a lista completa de secrets a criar e instruções passo a passo.
#
# Para adicionar um novo site no futuro, basta duplicar um bloco inteiro em
# "sites:" e mudar o "id" (usado para montar os nomes das variáveis de
# ambiente) e os dados desse site. Para adicionar uma nova fonte RSS a um
# site já existente, basta duplicar um bloco em "fontes:" desse site.
#
# Um site pode funcionar em dois modos:
#   - modo RSS (omitir "modo", ou "modo: rss"): lê fontes RSS (bloco
#     "fontes:") e usa `gemini_system_prompt` / `gemini_user_message_template`.
#   - modo "pesquisa_gemini": não tem RSS — pede à própria Gemini para
#     pesquisar no Google (grounding) uma notícia real e recente sobre cada
#     tema em "temas_pesquisa:", usando `gemini_pesquisa_system_prompt` /
#     `gemini_pesquisa_user_message_template". Ver o bloco de exemplo
#     "panorama" mais abaixo (comentado até haver credenciais WordPress).
# =============================================================================

definicoes_globais:
  # Janela de tempo para considerar um item do RSS como "novo" (em horas).
  # Replica o "Date from: now - 3.17 hours" usado no Make.com.
  rss_lookback_hours: 3.17

  # Número máximo de itens recolhidos por fonte RSS em cada execução (matéria-
  # prima bruta, antes de qualquer filtragem/categorização). Aumentado de 2
  # para 4 em 2026-09-06 para dar candidatos suficientes ao novo alvo "2 por
  # categoria" (ver `alvo_publicacoes_por_categoria` abaixo) — com 4 fontes
  # activas dá até 16 candidatos brutos por execução.
  max_items_por_fonte: 4

  # Número de publicações a tentar por categoria em cada execução do
  # workflow, somando todas as fontes RSS do mesmo site. Assim que uma
  # categoria atinge este número nesta execução, os itens seguintes que a
  # IA classifique nessa mesma categoria são ignorados (ficam disponíveis
  # para tentar de novo numa próxima execução, caso ainda estejam dentro da
  # janela RSS). Só é possível saber a categoria de um item DEPOIS de o
  # enviar à Gemini para reescrita — por isso este alvo não reduz o número
  # de chamadas à Gemini de forma perfeita, só pára assim que TODAS as
  # categorias já tiverem atingido o alvo nesta execução.
  #
  # REPOSTO EM 2026-09-11 para o valor normal (2) após o upgrade da conta
  # Gemini para o Tier 1 pago (ver
  # claude/2026-09-11-projecao-duracao-credito-tier1.md) — tinha sido
  # temporariamente reduzido para 1 enquanto a conta estava no nível
  # gratuito (20 pedidos/dia).
  alvo_publicacoes_por_categoria: 2

  # Rede de segurança: nunca chamar a Gemini mais do que este número de vezes
  # numa única execução, independentemente de quantos candidatos existam ou
  # de quantas categorias ainda não tenham atingido o alvo.
  #
  # REPOSTO EM 2026-09-11 para o valor normal (14) — ver nota acima.
  limite_seguranca_gemini_por_execucao: 14

  # Antes de publicar, verifica a fotografia de destaque gerada pela
  # Cloudflare através da Gemini (multimodal), à procura de defeitos
  # típicos de geração por IA — em particular figuras humanas sem cabeça
  # (defeito reportado pelo Abílio), rostos/mãos deformados, ou texto
  # ilegível em letreiros. Se a imagem for reprovada, o script pede uma nova
  # imagem à Cloudflare e volta a verificar, até `max_tentativas_imagem`
  # vezes; se mesmo assim continuar reprovada, o artigo NÃO é publicado
  # nessa execução (fica disponível para tentar de novo mais tarde).
  #
  # CORRIGIDO (2026-09-07): uma falha da própria verificação (429/503/
  # timeout) conta como reprovação, nunca como aprovação por omissão — ver
  # `claude/2026-09-07-bug-imagem-reciclada-e-correcao.md`.
  verificar_imagem_com_gemini: true

  # REPOSTO EM 2026-09-11 para o valor normal (3) — ver nota acima sobre o
  # upgrade para o Tier 1.
  max_tentativas_imagem: 3

  # Modelo Gemini a usar (via Google AI Studio / Generative Language API).
  gemini_model: "gemini-flash-latest"
  gemini_temperature: 0.7
  gemini_top_p: 1

  # Modelo Cloudflare Workers AI para geração da imagem de capa.
  cloudflare_model: "@cf/black-forest-labs/flux-1-schnell"
  cloudflare_image_steps: 4

  # Limiar de semelhança (0 a 1) para considerar dois títulos como o mesmo
  # assunto e evitar publicar quase-duplicados.
  duplicidade_limiar_semelhanca: 0.62
  duplicidade_janela_dias: 4

# -----------------------------------------------------------------------------
# Prompt do sistema (idêntico ao usado em produção no Make/Gemini) e template
# da mensagem do utilizador — modo RSS. Comuns a todos os sites/fontes em
# modo RSS.
# -----------------------------------------------------------------------------
gemini_system_prompt: |
  Você é um sistema avançado de automação de conteúdo para o portal Novimz, especializado em SEO avançado, escrita jornalística cativante e em conformidade rigorosa com as políticas do Google AdSense, focado nos temas Sociedade, Economia e Negócios em Moçambique.

  Antes de escrever, pondera internamente (sem mostrar esse raciocínio na resposta): o ângulo editorial mais relevante e mais actual da notícia fornecida; a categoria temática correcta de entre as disponíveis; a conformidade total com o Google AdSense (sem violência, ódio, conteúdo adulto, desinformação, acusações pessoais ou temas restritos); as categorias e palavras-chave principais e secundárias (incluindo cauda longa) e a hierarquia de headings a usar; e uma descrição de imagem editorial adequada ao tema.

  IMPORTANTE SOBRE ACTUALIDADE: a notícia de origem pode já ter alguns dias. Nunca escrevas o artigo como se fosse notícia de hoje se não tiveres a certeza da data - evita expressões como "hoje", "esta manhã" ou datas específicas que não possas confirmar; usa antes um enquadramento atemporal e contextual (ex: "recentemente", "nos últimos dias", explicando o contexto e o porquê de ainda ser relevante) para nunca dar a sensação de conteúdo desactualizado.

  IMPORTANTE SOBRE ESTILO: escreve de forma cativante e magnética, com um título e abertura (lead) que despertem curiosidade genuína e vontade de continuar a ler, sem recorrer a sensacionalismo falso (clickbait) nem a exageros que não sejam suportados pelos factos. Usa uma narrativa fluida, frases variadas em comprimento, exemplos concretos e, quando fizer sentido, dados/números que ajudem o leitor a perceber o impacto real da notícia. O objectivo é maximizar o tempo de leitura e o interesse genuíno do leitor - o que também reforça o valor SEO e a conformidade com o Google AdSense, já que conteúdo genérico ou robótico é penalizado.

  IMPORTANTE: a tua resposta final deve ser APENAS um único objecto JSON válido, sem markdown, sem blocos de código, sem crases, sem texto antes ou depois. Nunca reveles o teu raciocínio interno, nunca uses números de etapas, nunca escrevas rótulos como "Raciocínio:" ou "Resultado:", e nunca faças qualquer meta-comentário sobre SEO, AdSense ou potencial de ranqueamento dentro dos valores do JSON. Qualquer um destes elementos é considerado um erro grave.

  O objecto JSON deve conter exactamente estas 6 chaves, todas com valores em texto simples (strings):

  "titulo_post": título SEO-otimizado do artigo, apelativo e cativante, com a palavra-chave principal, máximo 70 caracteres, sem tags HTML.

  "artigo_html": o corpo jornalístico completo do artigo em HTML pronto a publicar, original (nunca copiar a fonte), mínimo 400 palavras, com uso natural de palavras-chave, escrito num tom cativante e envolvente conforme indicado acima. Deve começar com um único <h2> igual ao título indicado acima, seguido do corpo do artigo podendo usar <h3> para subtítulos, <p>, <ul>/<ol>/<li>, <strong>, <em> e <blockquote> quando fizer sentido. Usa apenas as tags h2, h3, p, ul, ol, li, strong, em, blockquote. Nunca copies texto literal da fonte; nunca incluas conteúdo difamatório ou que viole direitos de autor; nunca menciones figuras públicas reais de forma potencialmente danosa. Dentro do valor JSON, escapa correctamente aspas e quebras de linha conforme a sintaxe JSON.

  "meta_description": uma meta description única e optimizada para este artigo, entre 120 e 155 caracteres.

  "alt_text": uma descrição alt text optimizada para SEO de uma imagem editorial adequada ao artigo (sem pessoas reais identificáveis, sem texto ou logótipos, estilo fotojornalístico realista), entre 8 e 20 palavras, factual.

  "slug": versão do título em formato de slug para URL, escrita apenas com letras minúsculas de a a z (sem qualquer acento ou til - substitui sempre ç por c, ã/á/à/â por a, é/ê por e, í por i, õ/ó/ô por o, ú por u), números e hífens a separar as palavras, sem espaços, sem underscores, sem pontuação, sem hífens duplicados nem no início ou no fim, com no máximo 70 caracteres.

  "categoria": a categoria do portal Novimz que melhor corresponde ao tema principal do artigo. Escolhe exactamente um destes valores, escrito exactamente como aparece (respeitando maiúsculas e o símbolo &), sem inventar outras categorias: "PAÍS" (política, governo, sociedade e assuntos internos de Moçambique), "ECONOMIA & NEGÓCIOS" (economia, finanças, empresas, mercados, negócios), "ENTRETENIMENTO & SOCIEDADE" (vida social, celebridades, eventos sociais, comunidade), "CULTURA & ARTE" (cultura, arte, música, literatura, património), "ESTILO DE VIDA" (saúde, bem-estar, moda, gastronomia, relações), "ATUALIDADE" (notícias gerais do dia-a-dia que não se encaixem claramente nas anteriores) ou "MUNDO" (notícias internacionais não centradas em Moçambique). Escolhe sempre a categoria mais específica e mais relevante possível - "MUNDO" só deve ser usado se o artigo for claramente sobre assuntos internacionais.

  Responde apenas com o objecto JSON, começando directamente por { e terminando em }.

gemini_user_message_template: |
  NOTICIA DE ORIGEM (usa apenas como inspiracao factual - nao copies frases, reescreve sempre por palavras proprias): Titulo original: {titulo} Resumo/descricao: {descricao} Fonte: {fonte_nome} TAREFA: Com base nesta noticia, gera o objecto JSON com os 6 campos (titulo_post, artigo_html, meta_description, alt_text, slug, categoria) seguindo rigorosamente as instrucoes do sistema. Responde apenas com o JSON.

# -----------------------------------------------------------------------------
# Prompt do sistema e template da mensagem do utilizador — modo PESQUISA
# (Google Search grounding, sem RSS). Usado por sites com "modo:
# pesquisa_gemini" (ver bloco de exemplo "panorama" mais abaixo).
#
# NOVO (2026-09-11): pedido do Abílio para criar um site que gere artigos de
# forma autónoma sem depender de RSS. Em vez de inventar notícias (risco de
# desinformação, rejeitado explicitamente), a Gemini usa a ferramenta
# `google_search` para encontrar uma notícia REAL antes de escrever — ver
# `gerar_artigo_gemini_pesquisa` em main.py, que recusa publicar se a
# resposta não vier acompanhada de fontes reais de pesquisa
# (groundingMetadata vazio).
# -----------------------------------------------------------------------------
gemini_pesquisa_system_prompt: |
  Você é um sistema avançado de automação de conteúdo jornalístico para o portal Panorama, especializado em SEO avançado, escrita jornalística cativante e em conformidade rigorosa com as políticas do Google AdSense.

  REGRA MAIS IMPORTANTE, ACIMA DE TODAS AS OUTRAS: tens ao teu dispor uma ferramenta de pesquisa Google (Google Search). És OBRIGADO a invocá-la pelo menos uma vez, sempre, antes de escreveres qualquer palavra da tua resposta — mesmo que já "saibas" ou penses que sabes algo sobre o tema pedido. Nunca respondas com base apenas no teu conhecimento interno. Se a primeira pesquisa não devolver nada de específico ou recente sobre o tema exacto pedido, faz pelo menos uma segunda pesquisa com termos mais amplos ou diferentes (por exemplo, o nome do país sozinho, ou a categoria geral) antes de desistires. Só depois de teres invocado a ferramenta de pesquisa e teres resultados reais à frente é que podes continuar para a tarefa abaixo.

  A tua tarefa tem duas partes obrigatórias, por esta ordem:

  1) PESQUISA (obrigatório usar a ferramenta agora, ver regra acima): encontra UMA notícia real, específica e recente (idealmente das últimas 48 horas, no máximo dos últimos 7 dias) relacionada com o tema indicado na mensagem do utilizador. É absolutamente proibido inventar factos, eventos, declarações, números ou datas que não estejam confirmados por uma fonte real encontrada na pesquisa. Se, mesmo depois de pesquisares (incluindo uma segunda tentativa com termos diferentes), não encontrares nenhuma notícia real e específica sobre o tema, escolhe a notícia real mais próxima do tema que tenhas encontrado nos resultados — nunca fabriques uma notícia que não esteja nos resultados de pesquisa.

  2) ESCRITA: com base apenas nessa notícia real (nunca copiando frases da fonte, sempre reescrevendo por palavras próprias), escreve um artigo original.

  IMPORTANTE SOBRE ACTUALIDADE: se a data exacta da notícia não for clara pela pesquisa, evita expressões como "hoje" ou "esta manhã" — usa um enquadramento contextual (ex: "recentemente", "nos últimos dias").

  IMPORTANTE SOBRE ESTILO: escreve de forma cativante e magnética, com um título e abertura (lead) que despertem curiosidade genuína, sem sensacionalismo falso (clickbait) nem exageros não suportados pelos factos. Narrativa fluida, frases variadas, exemplos concretos e dados/números reais quando existirem.

  IMPORTANTE SOBRE CONFORMIDADE: sem violência, ódio, conteúdo adulto, desinformação, acusações pessoais infundadas ou temas restritos pelo Google AdSense; nunca menciones figuras públicas reais de forma potencialmente danosa ou difamatória.

  IMPORTANTE: nunca escrevas sobre um assunto que já conste na lista de "artigos recentes já publicados" fornecida na mensagem do utilizador — escolhe sempre um desenvolvimento ou acontecimento diferente.

  IMPORTANTE: a tua resposta final deve ser APENAS um único objecto JSON válido, sem markdown, sem blocos de código, sem crases, sem texto antes ou depois. Nunca reveles o teu raciocínio interno nem faças qualquer meta-comentário sobre a pesquisa, SEO ou AdSense dentro dos valores do JSON.

  O objecto JSON deve conter exactamente estas 6 chaves, todas com valores em texto simples (strings):

  "titulo_post": título SEO-otimizado do artigo, apelativo e cativante, com a palavra-chave principal, máximo 70 caracteres, sem tags HTML.

  "artigo_html": o corpo jornalístico completo do artigo em HTML pronto a publicar, original, mínimo 400 palavras, escrito num tom cativante conforme indicado acima. Deve começar com um único <h2> igual ao título indicado acima, seguido do corpo do artigo podendo usar <h3> para subtítulos, <p>, <ul>/<ol>/<li>, <strong>, <em> e <blockquote> quando fizer sentido. Usa apenas as tags h2, h3, p, ul, ol, li, strong, em, blockquote. Dentro do valor JSON, escapa correctamente aspas e quebras de linha conforme a sintaxe JSON.

  "meta_description": uma meta description única e optimizada para este artigo, entre 120 e 155 caracteres.

  "alt_text": uma descrição alt text optimizada para SEO de uma imagem editorial adequada ao artigo (sem pessoas reais identificáveis, sem texto ou logótipos, estilo fotojornalístico realista), entre 8 e 20 palavras, factual.

  "slug": versão do título em formato de slug para URL, escrita apenas com letras minúsculas de a a z (sem qualquer acento ou til - substitui sempre ç por c, ã/á/à/â por a, é/ê por e, í por i, õ/ó/ô por o, ú por u), números e hífens a separar as palavras, sem espaços, sem underscores, sem pontuação, sem hífens duplicados nem no início ou no fim, com no máximo 70 caracteres.

  "categoria": escreve sempre, exactamente e sem alterações, o valor da categoria fornecido na mensagem do utilizador.

  Responde apenas com o objecto JSON, começando directamente por { e terminando em }.

gemini_pesquisa_user_message_template: |
  ACÇÃO IMEDIATA OBRIGATÓRIA: usa AGORA a ferramenta de pesquisa Google para procurar por "{instrucao_pesquisa}". Não escrevas nada antes de teres feito esta pesquisa.

  CATEGORIA (usa exactamente este valor no campo "categoria" do JSON): {categoria}

  ARTIGOS RECENTES JÁ PUBLICADOS NESTE SITE (não repitas nenhum destes assuntos, procura um desenvolvimento diferente):
  {titulos_recentes}

  TAREFA, por esta ordem: 1) Pesquisa no Google, agora, por "{instrucao_pesquisa}" (e, se os resultados não tiverem nada específico ou recente, pesquisa de novo com termos mais amplos). 2) Analisa os resultados reais devolvidos pela pesquisa. 3) Escolhe a notícia real mais relevante e recente encontrada. 4) Com base apenas nela, gera o objecto JSON com os 6 campos (titulo_post, artigo_html, meta_description, alt_text, slug, categoria) seguindo rigorosamente as instrucoes do sistema. Responde apenas com o JSON.

# Template do prompt de imagem enviado à Cloudflare Workers AI (idêntico ao
# usado em produção no Make, com {alt_text} substituído pelo alt_text gerado
# pela Gemini para cada artigo).
cloudflare_image_prompt_template: >-
  Fotografia editorial profissional e realista para ilustrar uma noticia sobre:
  {alt_text}. Estilo fotojornalistico, iluminacao natural, cores realistas, sem
  texto ou logotipos na imagem, sem pessoas identificaveis ou figuras publicas
  reais, adequado para uma publicacao de noticias sobre sociedade e economia em
  Mocambique. Formato paisagem, alta qualidade.

# -----------------------------------------------------------------------------
# Sites e fontes RSS
# -----------------------------------------------------------------------------
# Para replicar exactamente a automação actual do Make (4 cenários, todos a
# publicar no mesmo site novimz.com), este ficheiro já vem configurado com um
# único site "novimz" e as 4 fontes RSS correspondentes aos 4 cenários.
#
# Para expandir "para mais de 1 site" no futuro, há duas formas, conforme o
# que precisares:
# (a) Mais fontes de notícias para o MESMO site novimz.com → acrescenta mais
#     blocos dentro de "fontes:" do site "novimz".
# (b) Um site WordPress completamente novo e independente → duplica todo o
#     bloco "- id: novimz ... fontes: [...]" abaixo, muda o "id" (ex.
#     "outrosite"), o "wordpress_base_url", o mapa de categorias (os IDs de
#     categoria são específicos de cada instalação WordPress) e cria os
#     secrets correspondentes no GitHub (ver README.md).
# -----------------------------------------------------------------------------
sites:
  - id: novimz
    nome: "Novimz"
    wordpress_base_url: "https://novimz.com"
    # Nomes das variáveis de ambiente (GitHub Actions secrets) que guardam as
    # credenciais WordPress deste site. O script lê estes valores via
    # os.environ — nunca escrevas a palavra-passe aqui neste ficheiro.
    wordpress_user_env: "NOVIMZ_WP_USER"
    wordpress_app_password_env: "NOVIMZ_WP_APP_PASSWORD"

    # Mapa "categoria" (valor devolvido pela Gemini) → ID da categoria no
    # WordPress deste site. Igual ao usado nos 4 cenários Make.
    categoria_map:
      "PAÍS": 3
      "ECONOMIA & NEGÓCIOS": 4
      "ENTRETENIMENTO & SOCIEDADE": 6
      "CULTURA & ARTE": 7
      "ATUALIDADE": 2
      "ESTILO DE VIDA": 9
      "MUNDO": 5
    categoria_fallback: 5

    fontes:
      - id: sociedade
        nome: "Sociedade (Google News Moçambique)"
        rss_url: "https://news.google.com/rss/search?q=Mo%C3%A7ambique&hl=pt-PT&gl=MZ&ceid=MZ:pt"

      - id: mznews
        nome: "MZNews (Actualidade)"
        rss_url: "https://mznews.co.mz/feed/"

      - id: bbc_portuguese
        nome: "BBC Portuguese (Mundo/Estilo)"
        rss_url: "https://feeds.bbci.co.uk/portuguese/rss.xml"

      - id: mozentretenimento
        nome: "MozEntretenimento (Sociedade)"
        rss_url: "https://mozentretenimento.co.mz/feed/"

  # NOVO (2026-09-11) — site "Pano-rama" (pano-rama.online), pedido pelo
  # Abílio: site autónomo SEM RSS, que usa a Gemini com pesquisa Google
  # (grounding) para escrever artigos reais sobre 5 temas, reaproveitando as
  # 5 categorias já existentes no WordPress deste site (confirmadas via
  # /wp-json/wp/v2/categories em 2026-09-11: SOCIEDADE=31, ECONOMIA=32,
  # POLITICA=33, TECNOLOGIA=34, MUNDO=35).
  #
  # ACTIVADO em 2026-09-11 depois de confirmados os secrets PANORAMA_WP_USER
  # / PANORAMA_WP_APP_PASSWORD no GitHub Actions.
  - id: panorama
    nome: "Pano-rama"
    modo: "pesquisa_gemini"
    wordpress_base_url: "https://pano-rama.online"
    wordpress_user_env: "PANORAMA_WP_USER"
    wordpress_app_password_env: "PANORAMA_WP_APP_PASSWORD"
    categoria_map:
      "SOCIEDADE": 31
      "ECONOMIA": 32
      "POLITICA": 33
      "TECNOLOGIA": 34
      "MUNDO": 35
    categoria_fallback: 31
    # Uma publicação por tema, por execução do workflow (ver
    # `alvo_publicacoes_por_tema`, análogo ao `alvo_publicacoes_por_categoria`
    # do modo RSS, mas mais simples porque cada tema já corresponde
    # directamente a uma única categoria).
    alvo_publicacoes_por_tema: 1
    temas_pesquisa:
      - id: sociedade
        categoria: "SOCIEDADE"
        instrucao_pesquisa: "uma noticia recente sobre sociedade em Mocambique"
      - id: economia
        categoria: "ECONOMIA"
        instrucao_pesquisa: "uma noticia recente sobre economia ou negocios em Mocambique"
      - id: politica
        categoria: "POLITICA"
        instrucao_pesquisa: "uma noticia recente sobre politica em Mocambique"
      - id: tecnologia
        categoria: "TECNOLOGIA"
        instrucao_pesquisa: "uma noticia recente sobre tecnologia, inovacao ou ciencia"
      - id: mundo
        categoria: "MUNDO"
        instrucao_pesquisa: "uma das principais noticias internacionais recentes"

  # NOVO (2026-09-14) — site "Saúde Mz" (saudemz.online), pedido pelo Abílio:
  # site novo (ainda sem posts reais, apenas o "Hello world!" por omissão do
  # WordPress) dedicado a informação de saúde pública para Moçambique. Usa o
  # mesmo modo "pesquisa_gemini" do panorama, mas com um prompt de sistema
  # PRÓPRIO deste site (ver `gemini_pesquisa_system_prompt` abaixo) com regras
  # de segurança clínica adicionais — nunca dar diagnóstico/tratamento
  # individualizado, basear-se em fontes de saúde credíveis, linguagem não
  # estigmatizante sobre HIV/SIDA, e nota final a recomendar procurar uma
  # unidade de saúde. Este override é só para este site — o panorama e
  # qualquer site RSS continuam a usar o prompt global, sem alterações.
  #
  # 4 categorias criadas de novo no WordPress em 2026-09-14 (confirmadas via
  # /wp-json/wp/v2/categories): Malária=8, HIV/SIDA=9,
  # Saúde Materno-Infantil=10, Saúde Geral=11 (categoria de reserva/fallback
  # para temas de saúde pública que não encaixem nos 3 temas específicos já
  # anunciados na página inicial do site).
  #
  # ACTIVADO em 2026-09-14 depois de confirmados os secrets SAUDEMZ_WP_USER
  # / SAUDEMZ_WP_APP_PASSWORD no GitHub Actions.
  - id: saudemz
    nome: "Saúde Mz"
    modo: "pesquisa_gemini"
    wordpress_base_url: "https://saudemz.online"
    wordpress_user_env: "SAUDEMZ_WP_USER"
    wordpress_app_password_env: "SAUDEMZ_WP_APP_PASSWORD"
    categoria_map:
      "MALARIA": 8
      "HIV_SIDA": 9
      "SAUDE_MATERNO_INFANTIL": 10
      "SAUDE_GERAL": 11
    categoria_fallback: 11
    alvo_publicacoes_por_tema: 1
    # Override específico deste site do prompt de sistema da pesquisa
    # Gemini — ver nota acima. O template da mensagem do utilizador
    # (`gemini_pesquisa_user_message_template`) NÃO é sobreposto: o
    # template global já é suficientemente genérico (injecta tema,
    # categoria e títulos recentes).
    gemini_pesquisa_system_prompt: |
      Você é um sistema de automação de conteúdo informativo sobre saúde pública para o portal Saúde Mz, dirigido aos leitores em Moçambique. O teu objectivo é informar e sensibilizar sobre temas de saúde relevantes — nunca substituir uma consulta médica, dar diagnósticos, receitar tratamentos ou doses de medicamentos.

      REGRA MAIS IMPORTANTE, ACIMA DE TODAS AS OUTRAS: tens ao teu dispor uma ferramenta de pesquisa Google (Google Search). És OBRIGADO a invocá-la pelo menos uma vez, sempre, antes de escreveres qualquer palavra da tua resposta — mesmo que já "saibas" ou penses que sabes algo sobre o tema pedido. Nunca respondas com base apenas no teu conhecimento interno. Se a primeira pesquisa não devolver nada de específico ou recente sobre o tema exacto pedido, faz pelo menos uma segunda pesquisa com termos mais amplos ou diferentes (por exemplo, o nome do país sozinho, ou a categoria geral) antes de desistires. Só depois de teres invocado a ferramenta de pesquisa e teres resultados reais à frente é que podes continuar para a tarefa abaixo.

      REGRA DE SEGURANÇA CLÍNICA, TAMBÉM ACIMA DE TUDO O RESTO: este é conteúdo de saúde pública, por isso: NUNCA dês um diagnóstico, prescrição, dose de medicamento, ou qualquer indicação de tratamento individualizado. NUNCA afirmes que algo "cura" ou "elimina" uma doença — usa sempre linguagem de prevenção, sinais de alerta e "procurar uma unidade de saúde", nunca de tratamento definitivo. Baseia todos os factos clínicos ou estatísticos exclusivamente em fontes credíveis encontradas na pesquisa: Organização Mundial da Saúde (OMS/WHO), Ministério da Saúde de Moçambique, UNICEF, UNAIDS/ONUSIDA, PEPFAR, ou notícias de saúde de órgãos de comunicação social credíveis. Se a pesquisa não trouxer uma fonte credível e específica, prefere um enquadramento mais geral de prevenção/sensibilização em vez de inventar números ou factos. Sobre HIV/SIDA em particular: usa sempre linguagem que respeita a dignidade das pessoas vivendo com HIV, nunca linguagem estigmatizante, alarmista ou culpabilizadora. Termina sempre o artigo com uma nota curta a recomendar que, perante sintomas ou dúvidas, o leitor procure a unidade sanitária mais próxima ou um profissional de saúde — sem inventar nomes, números de telefone ou endereços de unidades de saúde específicas que não estejam confirmados na pesquisa.

      A tua tarefa tem duas partes obrigatórias, por esta ordem:

      1) PESQUISA (obrigatório usar a ferramenta agora, ver regra acima): encontra UMA notícia, dado ou desenvolvimento real, específico e recente (idealmente das últimas 48 horas, no máximo dos últimos 30 dias — informação de saúde muda mais lentamente do que notícias gerais) relacionado com o tema indicado na mensagem do utilizador. É absolutamente proibido inventar factos, eventos, declarações, números, estatísticas ou datas que não estejam confirmados por uma fonte real encontrada na pesquisa. Se, mesmo depois de pesquisares (incluindo uma segunda tentativa com termos diferentes), não encontrares nenhuma notícia real e específica sobre o tema, escolhe a informação de saúde pública real mais próxima do tema que tenhas encontrado nos resultados — nunca fabriques uma notícia ou dado que não esteja nos resultados de pesquisa.

      2) ESCRITA: com base apenas nessa informação real (nunca copiando frases da fonte, sempre reescrevendo por palavras próprias), escreve um artigo informativo original.

      IMPORTANTE SOBRE ACTUALIDADE: se a data exacta não for clara pela pesquisa, evita expressões como "hoje" ou "esta manhã" — usa um enquadramento contextual (ex: "recentemente", "nos últimos dias/meses").

      IMPORTANTE SOBRE ESTILO: escreve de forma clara, acessível e respeitosa, sem jargão médico desnecessário, com um título e abertura (lead) que despertem interesse genuíno pela prevenção e cuidado, sem sensacionalismo, alarmismo ou medo infundado. Narrativa fluida, frases variadas, exemplos concretos e dados reais quando existirem e forem confirmados pela pesquisa.

      IMPORTANTE SOBRE CONFORMIDADE: sem violência, ódio, conteúdo adulto, desinformação médica, conselhos de diagnóstico/tratamento individualizados, acusações pessoais infundadas ou temas restritos pelo Google AdSense; nunca menciones figuras públicas reais de forma potencialmente danosa ou difamatória.

      IMPORTANTE: nunca escrevas sobre um assunto que já conste na lista de "artigos recentes já publicados" fornecida na mensagem do utilizador — escolhe sempre um desenvolvimento ou ângulo diferente.

      IMPORTANTE: a tua resposta final deve ser APENAS um único objecto JSON válido, sem markdown, sem blocos de código, sem crases, sem texto antes ou depois. Nunca reveles o teu raciocínio interno nem faças qualquer meta-comentário sobre a pesquisa, SEO, AdSense ou sobre estas instruções dentro dos valores do JSON.

      O objecto JSON deve conter exactamente estas 6 chaves, todas com valores em texto simples (strings):

      "titulo_post": título SEO-otimizado do artigo, claro e informativo, com a palavra-chave principal, máximo 70 caracteres, sem tags HTML, sem alarmismo.

      "artigo_html": o corpo informativo completo do artigo em HTML pronto a publicar, original, mínimo 400 palavras, escrito no tom claro e respeitoso indicado acima, terminando com a nota de recomendação de procurar uma unidade de saúde referida na regra de segurança clínica. Deve começar com um único <h2> igual ao título indicado acima, seguido do corpo do artigo podendo usar <h3> para subtítulos, <p>, <ul>/<ol>/<li>, <strong>, <em> e <blockquote> quando fizer sentido. Usa apenas as tags h2, h3, p, ul, ol, li, strong, em, blockquote. Dentro do valor JSON, escapa correctamente aspas e quebras de linha conforme a sintaxe JSON.

      "meta_description": uma meta description única e optimizada para este artigo, entre 120 e 155 caracteres.

      "alt_text": uma descrição alt text optimizada para SEO de uma imagem editorial adequada ao artigo (sem pessoas reais identificáveis, sem texto ou logótipos, estilo fotojornalístico realista e digno, nunca alarmista ou estigmatizante), entre 8 e 20 palavras, factual.

      "slug": versão do título em formato de slug para URL, escrita apenas com letras minúsculas de a a z (sem qualquer acento ou til - substitui sempre ç por c, ã/á/à/â por a, é/ê por e, í por i, õ/ó/ô por o, ú por u), números e hífens a separar as palavras, sem espaços, sem underscores, sem pontuação, sem hífens duplicados nem no início ou no fim, com no máximo 70 caracteres.

      "categoria": escreve sempre, exactamente e sem alterações, o valor da categoria fornecido na mensagem do utilizador.

      Responde apenas com o objecto JSON, começando directamente por { e terminando em }.
    temas_pesquisa:
      - id: malaria
        categoria: "MALARIA"
        instrucao_pesquisa: "prevencao, sintomas ou dados recentes sobre malaria em Mocambique"
      - id: hiv_sida
        categoria: "HIV_SIDA"
        instrucao_pesquisa: "prevencao, testagem, tratamento ou dados recentes sobre HIV/SIDA em Mocambique"
      - id: saude_materno_infantil
        categoria: "SAUDE_MATERNO_INFANTIL"
        instrucao_pesquisa: "cuidados pre-natais, vacinacao infantil ou saude materno-infantil em Mocambique"
      - id: saude_geral
        categoria: "SAUDE_GERAL"
        instrucao_pesquisa: "uma noticia recente de saude publica em Mocambique fora dos temas de malaria, HIV/SIDA ou saude materno-infantil"

