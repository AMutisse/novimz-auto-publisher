name: Novimz Auto-Publisher

on:
  schedule:
    # A cada 2 horas — mais frequente do que o agendamento "Every 3 hours" usado no Make.com.
    # O horário exacto dentro da hora pode variar um pouco (comportamento
    # normal do agendador do GitHub Actions em períodos de muita carga).
    - cron: "0 */2 * * *"
    workflow_dispatch: {}   # permite correr manualmente a partir do separador "Actions" no GitHub

permissions:
  contents: write   # necessário para o workflow poder gravar o histórico anti-duplicados

concurrency:
  group: novimz-auto-publisher
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Correr o publicador
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOVIMZ_WP_USER: ${{ secrets.NOVIMZ_WP_USER }}
          NOVIMZ_WP_APP_PASSWORD: ${{ secrets.NOVIMZ_WP_APP_PASSWORD }}
        run: python main.py

      - name: Gravar histórico anti-duplicados (se mudou)
        run: |
          if ! git diff --quiet -- state/published.json; then
            git config user.name "novimz-auto-publisher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/published.json
            git commit -m "chore: actualizar histórico de publicações [skip ci]"
            git push
          else
            echo "Sem alterações ao histórico — nada para gravar."
          fi
